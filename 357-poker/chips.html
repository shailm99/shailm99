<title>357 Chip Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Limelight&display=swap">
<style>
/* Layout: the same card-room table as the full app. Brand bar with the 3·5·7 round tracker,
   the felt "stage" holding the current step (deal → who's in → who won → result),
   and the seat rail with chip counts and the hand-rankings cheat sheet.
   Deliberately single-theme: green baize, brass and ivory, whatever the host theme. */
:root {
  color-scheme: dark;
  --felt: #0f4433;
  --felt-hi: #17604a;
  --felt-deep: #072419;
  --felt-line: rgba(220, 240, 228, 0.14);
  --rail: #1c120c;
  --rail-hi: #2d1d13;
  --brass: #d6a54b;
  --brass-hi: #f2cd7f;
  --brass-ink: #2a1a06;
  --ivory: #f6f0e2;
  --ink: #18130e;
  --text: #edf4ef;
  --muted: #a4c2b3;
  --good: #8fe0b0;
  --bad: #ff9c8c;
  --scrim: rgba(4, 18, 12, 0.72);
  --font-display: "Limelight", "Didot", "Bodoni 72", Georgia, serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--felt-deep);
  background-image: radial-gradient(ellipse 120% 80% at 50% 0%, var(--felt-hi) 0%, var(--felt) 38%, var(--felt-deep) 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 0 40px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--brass-hi); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* ---------- Brand bar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-block: 16px 14px; border-bottom: 1px solid var(--felt-line); }
.brand { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.tracker { display: flex; align-items: flex-end; gap: 4px; }
.tracker .step { display: grid; justify-items: center; gap: 2px; padding: 0 6px; }
.tracker .num { font-family: var(--font-display); font-size: 44px; line-height: 0.9; -webkit-text-stroke: 1px var(--muted); color: transparent; transition: color .3s, transform .3s; }
.tracker .lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); opacity: .6; }
.tracker .step.done .num { color: var(--muted); -webkit-text-stroke: 0; opacity: .55; }
.tracker .step.now .num { color: var(--brass-hi); -webkit-text-stroke: 0; transform: translateY(-2px); text-shadow: 0 0 22px rgba(242, 205, 127, .45); }
.tracker .step.now .lbl { color: var(--brass-hi); opacity: 1; }
.tracker .dot { font-family: var(--font-display); color: var(--muted); font-size: 28px; padding-bottom: 14px; opacity: .5; }
.brand-name { display: grid; }
.brand-name b { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .04em; color: var(--ivory); }
.brand-name span { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.bar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pot { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 8px; background: var(--rail); border: 1px solid var(--rail-hi); border-radius: 999px; }
.pot .stack { display: grid; }
.pot .stack i { display: block; width: 26px; height: 7px; margin-top: -3px; border-radius: 50%; background: var(--brass); border: 1px solid var(--brass-ink); }
.pot .stack i:first-child { margin-top: 0; }
.pot .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pot .v { font-size: 22px; font-weight: 700; color: var(--brass-hi); font-variant-numeric: tabular-nums; line-height: 1; }
.menu { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Buttons ---------- */
.btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; letter-spacing: .02em; background: var(--brass); color: var(--brass-ink); box-shadow: 0 2px 0 var(--brass-ink), 0 8px 18px rgba(0,0,0,.25); transition: transform .12s, background .12s; }
.btn:hover:not(:disabled) { background: var(--brass-hi); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 0 0 var(--brass-ink); }
.btn:disabled { opacity: .45; }
.btn.big { font-size: 18px; padding: 15px 28px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--felt-line); box-shadow: none; padding: 8px 14px; font-weight: 600; }
.btn.ghost:hover:not(:disabled) { background: rgba(255,255,255,.06); }
.btn.small { padding: 7px 13px; font-size: 14px; }

/* ---------- Main grid ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; padding-top: 22px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage {
  min-width: 0; position: relative; border-radius: 28px; padding: 34px clamp(22px, 4vw, 48px);
  background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.05), transparent 70%);
  border: 1px solid var(--felt-line);
  box-shadow: inset 0 0 0 10px var(--rail), inset 0 0 0 11px var(--rail-hi), 0 20px 50px rgba(0,0,0,.35);
  min-height: 420px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 22px;
  text-align: center; justify-items: center;
}
.eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-hi); font-weight: 600; }
.headline { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 4.2vw, 44px); line-height: 1.05; color: var(--ivory); }
.sub { color: var(--muted); max-width: 60ch; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }

/* ---------- Deal instructions ---------- */
.dealbox { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; text-align: left; width: 100%; max-width: 640px; background: rgba(0,0,0,.22); border: 1px solid var(--felt-line); border-radius: 18px; padding: 16px 20px; }
.wildcard {
  width: 74px; aspect-ratio: 5 / 7; border-radius: 9px; background: var(--ivory); color: var(--ink); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 40px; position: relative;
  box-shadow: 0 0 0 3px var(--brass-hi), 0 0 22px rgba(242,205,127,.5), 0 6px 14px rgba(0,0,0,.35);
}
.wildcard span { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); background: var(--brass); color: var(--brass-ink); font: 700 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; }
.dealbox h2 { font-size: 20px; color: var(--ivory); }
.dealbox p { color: var(--muted); font-size: 15px; }
.steps { display: grid; gap: 4px; width: 100%; max-width: 640px; text-align: left; }
.steps .k { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-hi); font-weight: 600; }

/* ---------- Player toggles ---------- */
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: 100%; max-width: 640px; }
.pick {
  display: grid; gap: 2px; justify-items: start; text-align: left; padding: 14px 16px; border-radius: 14px; min-width: 0;
  background: var(--rail); border: 2px solid var(--rail-hi); color: var(--text); transition: background .12s, border-color .12s, transform .12s;
}
.pick:hover { border-color: var(--brass); }
.pick .nm { font-weight: 700; font-size: 17px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .st { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pick[aria-pressed="true"] { background: var(--brass); border-color: var(--brass-hi); color: var(--brass-ink); transform: translateY(-2px); }
.pick[aria-pressed="true"] .st { color: var(--brass-ink); }
.pick.worst[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--ink); }
.pick.worst[aria-pressed="true"] .st { color: var(--ink); }
.preview { font-size: 14px; color: var(--muted); max-width: 640px; }

/* ---------- Result ---------- */
.verdict { background: rgba(0,0,0,.24); border: 1px solid var(--felt-line); border-radius: 18px; padding: 18px 20px; display: grid; gap: 10px; width: 100%; max-width: 680px; }
.verdict h2 { font-size: clamp(20px, 2.6vw, 26px); color: var(--ivory); }
.transfers { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.xfer { background: var(--rail); border: 1px solid var(--rail-hi); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.xfer b { color: var(--brass-hi); }
.banner { width: 100%; max-width: 680px; padding: 22px; border-radius: 18px; background: linear-gradient(180deg, rgba(242,205,127,.22), rgba(214,165,75,.08)); border: 1px solid var(--brass); }
.banner .headline { color: var(--brass-hi); }

/* ---------- Seats + cheat sheet ---------- */
.side { display: grid; gap: 10px; min-width: 0; }
.side-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.side-head h3 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.side-head span { font-size: 12px; color: var(--muted); }
.seat { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--rail); border: 1px solid var(--rail-hi); }
.seat .dealer { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: transparent; }
.seat .dealer.on { background: var(--ivory); color: var(--ink); }
.seat .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .chips { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.seat .legs { display: flex; gap: 4px; align-items: center; }
.seat .legs i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--brass); }
.seat .legs i.got { background: var(--brass-hi); border-color: var(--brass-hi); box-shadow: 0 0 6px rgba(242,205,127,.6); }
.seat .net { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
.seat .rb { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
.seat .nudge { grid-column: 2 / -1; justify-self: start; margin-top: 6px; }
.seat.broke .chips { color: var(--bad); }
.pos { color: var(--good); } .neg { color: var(--bad); } .zero { color: var(--muted); }
.cheat { background: rgba(0,0,0,.2); border: 1px solid var(--felt-line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; }
.cheat b { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-hi); }
.cheat ol { margin: 0; padding-left: 20px; display: grid; gap: 1px; }
.cheat p { font-size: 12.5px; color: var(--muted); }
details.log { background: rgba(0,0,0,.2); border: 1px solid var(--felt-line); border-radius: 12px; padding: 10px 12px; }
details.log summary { cursor: pointer; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
details.log ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; max-height: 280px; overflow-y: auto; font-size: 13px; color: var(--muted); }
details.log li { border-top: 1px solid var(--felt-line); padding-top: 6px; }
.house { font-size: 13px; color: var(--muted); padding: 0 4px; display: grid; gap: 2px; }

/* ---------- Setup ---------- */
.setup { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 26px; padding-top: 26px; align-items: start; }
@media (max-width: 860px) { .setup { grid-template-columns: minmax(0, 1fr); } }
.panel { background: rgba(0,0,0,.22); border: 1px solid var(--felt-line); border-radius: 20px; padding: 22px clamp(16px, 3vw, 28px); display: grid; gap: 18px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--ivory); }
.panel h3 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-hi); }
.names { display: grid; gap: 8px; }
.name-row { display: flex; gap: 8px; align-items: center; }
.name-row .seatno { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--rail); font-size: 12px; font-weight: 700; color: var(--muted); }
input[type="text"], input[type="number"], select { width: 100%; min-width: 0; background: var(--felt-deep); border: 1px solid var(--felt-line); border-radius: 8px; padding: 9px 11px; }
input:focus, select:focus { border-color: var(--brass); outline: none; box-shadow: 0 0 0 2px rgba(214,165,75,.35); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.field { display: grid; gap: 5px; align-content: start; min-width: 0; }
.field label { font-weight: 600; font-size: 14px; }
.hint { font-size: 12.5px; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--brass); flex: none; }
.err { color: var(--bad); font-size: 14px; }
.rules { display: grid; gap: 14px; font-size: 15px; }
.rules ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.rules li::marker { color: var(--brass-hi); font-weight: 700; }
.rules strong { color: var(--ivory); }

/* ---------- Modal ---------- */
.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 10; backdrop-filter: blur(3px); }
.modal .sheet { background: var(--felt-deep); border: 1px solid var(--felt-line); border-radius: 20px; width: min(760px, 100%); max-height: calc(100% - 24px); overflow-y: auto; padding: 24px clamp(16px, 3vw, 30px); display: grid; gap: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--ivory); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--felt-line); white-space: nowrap; }
th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.confirm { background: rgba(255,156,140,.08); border: 1px solid var(--bad); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.export { display: grid; gap: 8px; border-top: 1px solid var(--felt-line); padding-top: 14px; }
.export h3 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-hi); }
.export textarea { width: 100%; min-height: 120px; resize: vertical; background: var(--felt-deep); color: var(--muted); border: 1px solid var(--felt-line); border-radius: 8px; padding: 10px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.export .hint { font-size: 13px; color: var(--good); }

@media (max-width: 520px) {
  .tracker .num { font-size: 34px; }
  .stage { padding: 28px 20px; border-radius: 22px; }
  .picks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dealbox { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app" class="wrap"></div>

<script>
'use strict';

const ROUNDS = [
  { cards: 3, wild: 3, label: 'Threes wild', word: 'Threes' },
  { cards: 5, wild: 5, label: 'Fives wild', word: 'Fives' },
  { cards: 7, wild: 7, label: 'Sevens wild', word: 'Sevens' },
];
const STORE_KEY = 'poker357.chips.v1';
const HISTORY_MAX = 40;
const DEFAULTS = {
  startChips: 100, ante: 1, legsToWin: 3,
  payAmount: 'pot', fixedAmount: 5, whoPays: 'all', payTo: 'winner',
  threeCardRuns: false, nobodyIn: 'redeal', chipValue: 0.25,
};
let state = null;
let history = [];
let ui = { modal: null, confirmReset: false, setupNames: ['Player 1', 'Player 2', 'Player 3', 'Player 4'], setupError: '' };

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ state, history })); } catch (e) { /* storage unavailable */ } }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    return d && d.state && d.state.v === 1 ? d : null;
  } catch (e) { return null; }
}
function clearSaved() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } }
// Snapshot before every committed step so a mis-tap can be undone.
function checkpoint() { history.push(JSON.stringify(state)); if (history.length > HISTORY_MAX) history.shift(); }
function undo() { if (history.length) state = JSON.parse(history.pop()); }

const N = () => state.players.length;
// Total chips a player has bought, buy-in plus rebuys. Older saves only had the buy-in.
const boughtOf = p => p.bought ?? state.settings.startChips;
const nameOf = i => state.players[i].name;
function seatOrder() { const n = N(); return Array.from({ length: n }, (_, k) => (state.dealer + 1 + k) % n); }
function log(msg) { state.log.unshift(msg); if (state.log.length > 2000) state.log.length = 2000; }
function plural(n, w) { return `${n} ${w}${n === 1 ? '' : 's'}`; }
const listNames = ids => { const n = ids.map(nameOf); return n.length < 3 ? n.join(' and ') : `${n.slice(0, -1).join(', ')} and ${n[n.length - 1]}`; };

/* =================== Game flow =================== */
function startNight(names, settings) {
  state = {
    v: 1, settings,
    players: names.map(name => ({ name, chips: settings.startChips, legs: 0, bought: settings.startChips, rebuys: 0 })),
    dealer: names.length - 1, round: 0, pot: 0, handNo: 0, gameNo: 1, gameOver: false,
    phase: 'declare', sel: [], ins: [], winners: [], worst: [], result: null, log: [],
  };
  history = [];
  log(`Night started with ${names.length} players, ${settings.startChips} chips each. First to ${plural(settings.legsToWin, 'leg')} takes the pot.`);
  newHand();
}

function newHand() {
  const S = state.settings;
  state.dealer = (state.dealer + 1) % N();
  state.handNo++;
  for (const p of state.players) p.chips -= S.ante;
  state.pot += S.ante * N();
  state.round = 0;
  startRound();
  log(`Hand ${state.handNo}: ${nameOf(state.dealer)} deals. Everyone antes ${S.ante}; pot is ${state.pot}.`);
}
function startRound() {
  state.phase = 'declare';
  state.sel = []; state.ins = []; state.winners = []; state.worst = []; state.result = null;
}

function applyRebuy(i, amt) {
  const p = state.players[i];
  p.bought = boughtOf(p) + amt;
  p.chips += amt;
  p.rebuys = (p.rebuys || 0) + 1;
  log(`${p.name} rebought for ${amt} chips (${money(amt * state.settings.chipValue)}).`);
}

function payBase() { const S = state.settings; return S.payAmount === 'pot' ? state.pot : S.fixedAmount; }
function needsWorstPick(ins, winners) {
  const losers = ins.filter(i => !winners.includes(i));
  return state.settings.whoPays === 'worst' && losers.length > 1;
}

// Who pays whom for a showdown. Pure: used for the live preview and for the real settlement.
function planShowdown(ins, winners, worst) {
  const S = state.settings, losers = ins.filter(i => !winners.includes(i));
  if (!winners.length) return null;
  if (!losers.length) return { type: 'tie', legs: winners.slice(), transfers: [] };
  let payers = losers;
  if (S.whoPays === 'worst') {
    payers = losers.length === 1 ? losers : worst.filter(i => losers.includes(i));
    if (!payers.length) return null;
  }
  const base = payBase(), transfers = [];
  for (const payer of payers) {
    if (S.payTo === 'pot') { transfers.push({ from: payer, to: 'pot', amt: base }); continue; }
    const share = Math.floor(base / winners.length), rem = base % winners.length;
    winners.forEach((w, k) => transfers.push({ from: payer, to: w, amt: share + (k < rem ? 1 : 0) }));
  }
  return { type: 'showdown', legs: [], transfers };
}

function confirmIns() {
  const order = seatOrder();
  const ins = order.filter(i => state.sel.includes(i));
  state.ins = ins; state.sel = [];
  if (ins.length === 0) {
    log(`${ROUNDS[state.round].label}: nobody went in.`);
    finish({ type: 'none', legs: [], transfers: [] });
  } else if (ins.length === 1) {
    log(`${ROUNDS[state.round].label}: ${nameOf(ins[0])} went in alone and took a leg (${state.players[ins[0]].legs + 1}/${state.settings.legsToWin}).`);
    finish({ type: 'solo', legs: [ins[0]], transfers: [] });
  } else {
    state.phase = 'showdown';
  }
}

function inOutText(ins) {
  const out = seatOrder().filter(i => !ins.includes(i));
  return `${ROUNDS[state.round].label}: in ${listNames(ins)}; out ${out.length ? listNames(out) : 'nobody'}.`;
}

function confirmShowdown() {
  const order = seatOrder();
  const winners = order.filter(i => state.winners.includes(i) && state.ins.includes(i));
  const plan = planShowdown(state.ins, winners, state.worst);
  if (!plan) return;
  plan.winners = winners;
  const who = inOutText(state.ins);
  if (plan.type === 'tie') log(`${who} Everyone in tied (${listNames(winners)}); each takes a leg.`);
  else log(`${who} ${listNames(winners)} won the showdown. ${plan.transfers.map(t => `${nameOf(t.from)} → ${t.to === 'pot' ? 'pot' : nameOf(t.to)} ${t.amt}`).join(', ')}.`);
  finish(plan);
}

function finish(res) {
  const S = state.settings, P = state.players;
  for (const t of res.transfers) {
    P[t.from].chips -= t.amt;
    if (t.to === 'pot') state.pot += t.amt; else P[t.to].chips += t.amt;
  }
  for (const i of res.legs) P[i].legs++;
  res.round = state.round;
  res.potWinners = []; res.potWon = 0;
  const reached = seatOrder().filter(i => P[i].legs >= S.legsToWin);
  if (reached.length) {
    const pot = state.pot, share = Math.floor(pot / reached.length), rem = pot % reached.length;
    reached.forEach((i, k) => { P[i].chips += share + (k < rem ? 1 : 0); });
    res.potWinners = reached; res.potWon = pot;
    state.pot = 0; state.gameOver = true;
    log(`Game ${state.gameNo}: ${listNames(reached)} reached ${plural(S.legsToWin, 'leg')} and won the pot of ${pot}.`);
  }
  state.result = res;
  state.phase = 'result';
}

function proceed() {
  const S = state.settings, res = state.result;
  if (state.gameOver) {
    state.gameOver = false; state.gameNo++;
    for (const p of state.players) p.legs = 0;
    log(`Game ${state.gameNo} begins. Legs reset.`);
    newHand();
  } else if (res.type === 'none' && S.nobodyIn === 'redeal') {
    log('Cards thrown in for a fresh deal.');
    newHand();
  } else if (state.round < 2) {
    state.round++;
    startRound();
    log(`Two more cards each. ${ROUNDS[state.round].label}.`);
  } else {
    newHand();
  }
}
function proceedLabel() {
  const S = state.settings, res = state.result;
  if (state.gameOver) return `Start game ${state.gameNo + 1} (everyone antes ${S.ante})`;
  if (res.type === 'none' && S.nobodyIn === 'redeal') return `Throw in and re-deal (everyone antes ${S.ante})`;
  if (state.round < 2) return `Next: deal 2 more, ${ROUNDS[state.round + 1].label.toLowerCase()}`;
  return `New hand (everyone antes ${S.ante})`;
}

function settleModal() {
  const S = state.settings, P = state.players;
  const n = P.length, potShare = Math.floor(state.pot / n), potRem = state.pot % n;
  const rows = P.map((p, i) => {
    const back = potShare + (i < potRem ? 1 : 0);
    return { name: p.name, bought: boughtOf(p), chips: p.chips, back, net: p.chips + back - boughtOf(p) };
  });
  // Greedy settle: biggest debtor pays biggest creditor until everyone is square.
  const cents = rows.map(r => Math.round(r.net * S.chipValue * 100));
  const debt = cents.map((c, i) => ({ i, c })).filter(x => x.c < 0).map(x => ({ i: x.i, c: -x.c })).sort((a, b) => b.c - a.c);
  const cred = cents.map((c, i) => ({ i, c })).filter(x => x.c > 0).sort((a, b) => b.c - a.c);
  const pays = [];
  let a = 0, b = 0;
  while (a < debt.length && b < cred.length) {
    const m = Math.min(debt[a].c, cred[b].c);
    if (m > 0) pays.push({ from: debt[a].i, to: cred[b].i, c: m });
    debt[a].c -= m; cred[b].c -= m;
    if (debt[a].c === 0) a++;
    if (cred[b].c === 0) b++;
  }
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Settle up"><div class="sheet">
    <div class="sheet-head"><h2>Settle up</h2><button class="btn ghost small" data-act="close">Back to the game</button></div>
    <p class="sub">If you stopped right now. ${state.pot ? `The ${state.pot}-chip pot hasn't been won yet, so it's split evenly back to everyone.` : 'The pot is empty.'}</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Player</th><th class="num">${S.chipValue > 0 ? 'Paid in' : 'Bought in'}</th><th class="num">Chips</th><th class="num">Pot share</th><th class="num">Net chips</th><th class="num">Net $</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${S.chipValue > 0 ? money(r.bought * S.chipValue) : r.bought}</td><td class="num">${r.chips}</td><td class="num">${r.back}</td><td class="num ${r.net > 0 ? 'pos' : r.net < 0 ? 'neg' : 'zero'}">${signed(r.net)}</td><td class="num ${r.net > 0 ? 'pos' : r.net < 0 ? 'neg' : 'zero'}">${money(r.net * S.chipValue)}</td></tr>`).join('')}</tbody>
    </table></div>
    ${S.chipValue > 0 ? `<div class="transfers" style="justify-content:flex-start">${pays.length ? pays.map(p => `<span class="xfer">${esc(P[p.from].name)} pays ${esc(P[p.to].name)} <b>${money(p.c / 100)}</b></span>`).join('') : '<span class="sub">Everyone is square.</span>'}</div>` : ''}
    ${exportHTML()}
    ${ui.confirmReset
      ? `<div class="confirm"><p>End the night? This clears every chip count and starts over at the seating screen.</p><div class="row" style="justify-content:flex-start"><button class="btn small" data-act="reset-yes">Yes, end the night</button><button class="btn ghost small" data-act="reset-no">Keep playing</button></div></div>`
      : `<div class="row" style="justify-content:flex-start"><button class="btn ghost small" data-act="reset-ask">End the night and start over</button></div>`}
  </div></div>`;
}

    <p class="sub">Who's buying more chips?</p>
    <div class="picks" style="max-width:none">${state.players.map((p, i) => `<button class="pick" data-act="rb-pick" data-i="${i}" aria-pressed="${who === i}"><span class="nm">${esc(p.name)}</span><span class="st">${p.chips} chips${p.rebuys ? ' · ' + plural(p.rebuys, 'rebuy') : ''}</span></button>`).join('')}</div>
    <div class="field" style="max-width:280px"><label for="rebuy-amt">Chips to add</label><input type="number" id="rebuy-amt" min="1" step="1" value="${amt}"><span class="hint" id="rebuy-cost">${rebuyCost(amt)}</span></div>
    <div class="row" style="justify-content:flex-start"><button class="btn" data-act="rb-confirm" id="rb-confirm" ${ok ? '' : 'disabled'}>${esc(rebuyLabel(who, amt))}</button></div>
  </div></div>`;
}
function rebuyLabel(who, amt) {
  if (who === null) return 'Pick a player';
  if (!(amt > 0)) return 'Enter how many chips';
  return `Add ${amt} chips to ${nameOf(who)}`;
}
function readRebuyAmt() {
  const el = document.getElementById('rebuy-amt');
  const x = el ? Math.round(parseFloat(el.value)) : ui.rebuyAmt;
  return Number.isFinite(x) ? Math.max(0, x) : 0;
}

// Plain-text record of the night: rules, standings and every logged event, oldest first.
function exportText() {
  const S = state.settings, P = state.players;
  const gamesDone = state.gameNo - 1 + (state.gameOver ? 1 : 0);
  const lines = [
    `357 Poker game log, exported ${new Date().toLocaleString()}`,
    `Players: ${P.length}. Hands dealt: ${state.handNo}. Games won: ${gamesDone}. Pot still on the table: ${state.pot}.`,
    `House rules: ${houseRulesShort().join('; ')}; if nobody goes in: ${S.nobodyIn === 'redeal' ? 're-deal' : 'next round'}.`,
    '',
    'Standings:',
    ...P.map(p => {
      const net = p.chips - boughtOf(p);
      return `- ${p.name}: bought in ${boughtOf(p)} chips (${money(boughtOf(p) * S.chipValue)}), ${plural(p.rebuys || 0, 'rebuy')}, now ${p.chips} chips, ${plural(p.legs, 'leg')} in the current game, net ${signed(net)} chips (${money(net * S.chipValue)})`;
    }),
    '',
    'Hand history, oldest first:',
    ...state.log.slice().reverse().map(l => typeof l === 'string' ? l : l.msg),
  ];
  return lines.join('\n');
}
function exportHTML() {
  return `<div class="export"><h3>Game log</h3>
    <p class="sub">Copy the full record of the night and paste it to Claude for stats and a recap.</p>
    <div class="row" style="justify-content:flex-start"><button class="btn small" data-act="copy-log">Copy game log</button><span class="hint" id="copy-status" role="status"></span></div>
    <textarea id="log-text" readonly aria-label="Game log">${esc(exportText())}</textarea></div>`;
}

function render() {
  if (!state) {
    app.innerHTML = setupHTML();
  } else {
    const stage = state.phase === 'declare' ? stageDeclare() : state.phase === 'showdown' ? stageShowdown() : stageResult();
    app.innerHTML = `${barHTML()}<div class="main">${stage}${sideHTML()}</div>`;
  }
  modalRoot.innerHTML = ui.modal === 'rules' ? rulesModal()
    : ui.modal === 'settle' && state ? settleModal()
    : ui.modal === 'rebuy' && state ? rebuyModal() : '';
}

/* =================== Setup form =================== */
function readSetup() {
  const v = id => document.getElementById(id);
  const names = ui.setupNames.map((_, k) => (v('name-' + k)?.value ?? '').trim());
  const num = (id, d) => { const x = parseFloat(v(id)?.value); return Number.isFinite(x) ? x : d; };
  return {
    names,
    settings: {
      startChips: Math.max(1, Math.round(num('startChips', DEFAULTS.startChips))),
      ante: Math.max(0, Math.round(num('ante', DEFAULTS.ante))),
      chipValue: Math.max(0, Math.round(num('chipValue', DEFAULTS.chipValue) * 100) / 100),
      legsToWin: parseInt(v('legsToWin').value, 10),
      payAmount: v('payAmount').value,
      fixedAmount: Math.max(0, Math.round(num('fixedAmount', DEFAULTS.fixedAmount))),
      whoPays: v('whoPays').value,
      payTo: v('payTo').value,
      nobodyIn: v('nobodyIn').value,
      threeCardRuns: v('threeCardRuns').checked,
    },
  };
}
function stashSetup() { if (!state && document.getElementById('setup-form')) { const { names, settings } = readSetup(); ui.setupNames = names; ui.setupSettings = settings; } }

document.addEventListener('submit', e => {
  if (e.target.id !== 'setup-form') return;
  e.preventDefault();
  const { names, settings } = readSetup();
  const filled = names.map((n, k) => n || `Player ${k + 1}`);
  const lower = filled.map(n => n.toLowerCase());
  if (new Set(lower).size !== lower.length) { ui.setupNames = names; ui.setupSettings = settings; ui.setupError = 'Two players have the same name. Give everyone a different name so the taps are clear.'; render(); return; }
  ui.setupError = '';
  startNight(filled, settings);
  save(); render(); window.scrollTo(0, 0);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'startChips' || id === 'chipValue') {
    const h = document.getElementById('buyin-hint');
    const c = parseFloat(document.getElementById('startChips').value) || 0, v = parseFloat(document.getElementById('chipValue').value) || 0;
    if (h) h.textContent = buyinHint(Math.round(c), Math.round(v * 100) / 100);
  } else if (id === 'rebuy-amt') {
    ui.rebuyAmt = readRebuyAmt();
    document.getElementById('rebuy-cost').textContent = rebuyCost(ui.rebuyAmt);
    const b = document.getElementById('rb-confirm');
    b.disabled = !(ui.rebuyFor !== null && ui.rebuyAmt > 0);
    b.textContent = rebuyLabel(ui.rebuyFor, ui.rebuyAmt);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'payAmount') { const w = document.getElementById('fixed-wrap'); if (w) w.hidden = e.target.value !== 'fixed'; }
});

/* =================== Actions =================== */
function toggle(list, i) { const k = list.indexOf(i); if (k >= 0) list.splice(k, 1); else list.push(i); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (e.target.classList && e.target.classList.contains('modal')) { ui.modal = null; ui.confirmReset = false; render(); }
    return;
  }
  if (el.disabled) return;
  const act = el.dataset.act, i = el.dataset.i !== undefined ? +el.dataset.i : null;
  let changed = true, top = false;
  switch (act) {
    case 'add-player': stashSetup(); if (ui.setupNames.length < 7) ui.setupNames.push(`Player ${ui.setupNames.length + 1}`); changed = false; break;
    case 'rm-player': stashSetup(); ui.setupNames.splice(+el.dataset.k, 1); changed = false; break;
    case 'rules': stashSetup(); ui.modal = 'rules'; changed = false; break;
    case 'settle': ui.modal = 'settle'; ui.confirmReset = false; changed = false; break;
    case 'close': ui.modal = null; ui.confirmReset = false; changed = false; break;
    case 'copy-log': {
      const ta = document.getElementById('log-text');
      const done = ok => {
        const st = document.getElementById('copy-status');
        if (st) st.textContent = ok ? 'Copied. Paste it into your chat with Claude.' : "Copying was blocked here, so the text is selected below. Copy it by hand.";
        if (!ok && ta) { ta.focus(); ta.select(); }
      };
      try { navigator.clipboard.writeText(ta.value).then(() => done(true), () => done(false)); } catch (err) { done(false); }
      return;
    }
    case 'reset-ask': ui.confirmReset = true; changed = false; break;
    case 'reset-no': ui.confirmReset = false; changed = false; break;
    case 'reset-yes':
      ui.setupNames = state.players.map(p => p.name); ui.setupSettings = state.settings;
      state = null; history = []; ui.modal = null; ui.confirmReset = false; clearSaved(); changed = false; top = true; break;
    case 'undo': undo(); top = true; break;
    case 'rebuy': ui.modal = 'rebuy'; ui.rebuyFor = i; ui.rebuyAmt = state.settings.startChips; changed = false; break;
    case 'rb-pick': ui.rebuyAmt = readRebuyAmt(); ui.rebuyFor = i; changed = false; break;
    case 'rb-confirm': {
      const amt = readRebuyAmt();
      if (ui.rebuyFor === null || !(amt > 0)) { changed = false; break; }
      checkpoint(); applyRebuy(ui.rebuyFor, amt); ui.modal = null; break;
    }
    case 'tog-in': toggle(state.sel, i); break;
    case 'tog-win': toggle(state.winners, i); state.worst = state.worst.filter(w => !state.winners.includes(w)); break;
    case 'tog-worst': toggle(state.worst, i); break;
    case 'confirm-ins': checkpoint(); confirmIns(); top = true; break;
    case 'confirm-sd': checkpoint(); confirmShowdown(); top = true; break;
    case 'proceed': checkpoint(); proceed(); top = true; break;
    default: return;
  }
  if (changed) save();
  render();
  if (top) window.scrollTo(0, 0);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.modal) { ui.modal = null; ui.confirmReset = false; render(); } });

/* =================== Boot =================== */
function boot(data) {
  const snap = data && data.state && data.state.v === 1 ? data : load();
  if (snap) { state = snap.state; history = snap.history || []; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ state, history }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
