<title>357 Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Libre+Caslon+Text:wght@700&family=Limelight&display=swap">
<style>
/* Layout: a card-room table. Brand bar with the 3·5·7 round tracker on top,
   the felt "stage" on the left where the current step happens, the seat rail on the right.
   Deliberately single-theme: green baize, brass and ivory cards, whatever the host theme. */
:root {
  color-scheme: dark;
  --felt: #0f4433;
  --felt-hi: #17604a;
  --felt-deep: #072419;
  --felt-line: rgba(220, 240, 228, 0.14);
  --rail: #1c120c;
  --rail-hi: #2d1d13;
  --brass: #d6a54b;
  --brass-hi: #f2cd7f;
  --brass-ink: #2a1a06;
  --ivory: #f6f0e2;
  --ink: #18130e;
  --suit-red: #b3261e;
  --text: #edf4ef;
  --muted: #a4c2b3;
  --good: #8fe0b0;
  --bad: #ff9c8c;
  --scrim: rgba(4, 18, 12, 0.72);
  --font-display: "Limelight", "Didot", "Bodoni 72", Georgia, serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-card: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--felt-deep);
  background-image: radial-gradient(ellipse 120% 80% at 50% 0%, var(--felt-hi) 0%, var(--felt) 38%, var(--felt-deep) 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 0 40px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass-hi); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* ---------- Brand bar ---------- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px 20px; padding-block: 16px 14px; border-bottom: 1px solid var(--felt-line);
}
.brand { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.tracker { display: flex; align-items: flex-end; gap: 4px; }
.tracker .step { display: grid; justify-items: center; gap: 2px; padding: 0 6px; }
.tracker .num {
  font-family: var(--font-display); font-size: 44px; line-height: 0.9; color: var(--felt-line);
  -webkit-text-stroke: 1px var(--muted); color: transparent; transition: color .3s, transform .3s;
}
.tracker .lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); opacity: .6; }
.tracker .step.done .num { color: var(--muted); -webkit-text-stroke: 0; opacity: .55; }
.tracker .step.now .num { color: var(--brass-hi); -webkit-text-stroke: 0; transform: translateY(-2px); text-shadow: 0 0 22px rgba(242, 205, 127, .45); }
.tracker .step.now .lbl { color: var(--brass-hi); opacity: 1; }
.tracker .dot { font-family: var(--font-display); color: var(--muted); font-size: 28px; padding-bottom: 14px; opacity: .5; }
.brand-name { display: grid; gap: 0; }
.brand-name b { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .04em; color: var(--ivory); }
.brand-name span { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.bar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pot {
  display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 8px;
  background: var(--rail); border: 1px solid var(--rail-hi); border-radius: 999px;
}
.pot .stack { display: grid; }
.pot .stack i { display: block; width: 26px; height: 7px; margin-top: -3px; border-radius: 50%; background: var(--brass); border: 1px solid var(--brass-ink); }
.pot .stack i:first-child { margin-top: 0; }
.pot .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pot .v { font-size: 22px; font-weight: 700; color: var(--brass-hi); font-variant-numeric: tabular-nums; line-height: 1; }
.menu { display: flex; gap: 6px; }

/* ---------- Buttons ---------- */
.btn {
  border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; letter-spacing: .02em;
  background: var(--brass); color: var(--brass-ink); box-shadow: 0 2px 0 var(--brass-ink), 0 8px 18px rgba(0,0,0,.25);
  transition: transform .12s, background .12s;
}
.btn:hover { background: var(--brass-hi); }
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--brass-ink); }
.btn.big { font-size: 18px; padding: 15px 28px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--felt-line); box-shadow: none; padding: 8px 14px; font-weight: 600; }
.btn.ghost:hover { background: rgba(255,255,255,.06); }
.btn.small { padding: 7px 13px; font-size: 14px; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 4px; font-size: 14px; }
.link:hover { color: var(--text); }

/* ---------- Main grid ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; padding-top: 22px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage {
  min-width: 0; position: relative; border-radius: 28px; padding: 34px clamp(22px, 4vw, 48px);
  background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.05), transparent 70%);
  border: 1px solid var(--felt-line);
  box-shadow: inset 0 0 0 10px var(--rail), inset 0 0 0 11px var(--rail-hi), 0 20px 50px rgba(0,0,0,.35);
  min-height: 420px;
  display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 22px;
}
.eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-hi); font-weight: 600; }
.headline { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.05; color: var(--ivory); }
.sub { color: var(--muted); max-width: 60ch; }
.center { text-align: center; justify-items: center; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.center .row { justify-content: center; }

/* ---------- Cards ---------- */
.hand { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; --cw: clamp(58px, 11vw, 96px); }
.hand.sm { --cw: 46px; gap: 6px; justify-content: flex-start; }
.card {
  position: relative; width: var(--cw); aspect-ratio: 5 / 7; flex: none;
  background: var(--ivory); color: var(--ink); border-radius: calc(var(--cw) * .1);
  box-shadow: 0 1px 0 rgba(0,0,0,.4), 0 6px 14px rgba(0,0,0,.35);
  font-family: var(--font-card); font-weight: 700;
  animation: deal .42s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--i, 0) * 70ms);
}
.card.red { color: var(--suit-red); }
.card .corner { position: absolute; top: 6%; left: 9%; line-height: .95; font-size: calc(var(--cw) * .25); text-align: center; }
.card .pip { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cw) * .5); padding-top: 12%; }
.card.wild { box-shadow: 0 0 0 3px var(--brass-hi), 0 0 22px rgba(242,205,127,.55), 0 6px 14px rgba(0,0,0,.35); }
.card .wildtag {
  position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%);
  background: var(--brass); color: var(--brass-ink); font-family: var(--font-body); font-weight: 700;
  font-size: max(10px, calc(var(--cw) * .14)); letter-spacing: .06em; text-transform: uppercase;
  padding: 1px 7px; border-radius: 999px; white-space: nowrap;
}
.card.dim { opacity: .38; filter: saturate(.4); }
.card.fresh::after {
  content: "new"; position: absolute; top: -8px; right: -6px; background: var(--good); color: var(--felt-deep);
  font: 700 10px/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; padding: 3px 5px; border-radius: 4px;
}
.card.back {
  background-color: var(--suit-red);
  background-image: repeating-linear-gradient(45deg, rgba(246,240,226,.22) 0 2px, transparent 2px 9px), repeating-linear-gradient(-45deg, rgba(246,240,226,.22) 0 2px, transparent 2px 9px);
  border: 4px solid var(--ivory);
}
.fan { display: flex; justify-content: center; --cw: 64px; }
.fan .card { margin-left: calc(var(--cw) * -.55); transform: rotate(calc((var(--i) - var(--mid)) * 5deg)); transform-origin: 50% 120%; animation: none; }
.fan .card:first-child { margin-left: 0; }
@keyframes deal { from { opacity: 0; transform: translateY(-18px) rotate(-4deg); } to { opacity: 1; transform: none; } }

/* ---------- Private view ---------- */
.secret-note { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.secret-note::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 8px var(--bad); }
.besthand { display: grid; gap: 2px; justify-items: center; padding-top: 6px; }
.besthand .k { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.besthand .v { font-size: 24px; font-weight: 700; color: var(--ivory); }
.stakes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; width: 100%; max-width: 620px; }
.stake { background: rgba(0,0,0,.2); border: 1px solid var(--felt-line); border-radius: var(--radius); padding: 10px 14px; text-align: left; }
.stake .k { font-size: 12px; color: var(--muted); }
.stake .v { font-weight: 600; }
.choice { display: flex; gap: clamp(18px, 5vw, 44px); justify-content: center; flex-wrap: wrap; }
.chipbtn {
  width: 132px; height: 132px; border-radius: 50%; border: 0; display: grid; place-items: center; position: relative;
  font-family: var(--font-display); font-size: 34px; letter-spacing: .04em;
  transition: transform .15s;
}
.chipbtn::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; border: 3px dashed currentColor; opacity: .55; }
.chipbtn small { position: absolute; bottom: 26px; font: 600 11px var(--font-body); letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.chipbtn:hover { transform: translateY(-3px) rotate(-6deg); }
.chipbtn.in { background: var(--brass); color: var(--brass-ink); box-shadow: 0 4px 0 var(--brass-ink), 0 14px 26px rgba(0,0,0,.35); }
.chipbtn.out { background: var(--rail); color: var(--muted); box-shadow: 0 4px 0 #000, 0 14px 26px rgba(0,0,0,.35); }

/* ---------- Reveal ---------- */
.decls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.decl { display: grid; justify-items: center; gap: 6px; min-width: 84px; }
.decl .token {
  width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; letter-spacing: .08em;
  animation: flip .5s ease both; animation-delay: calc(var(--i, 0) * 90ms + 150ms);
}
.decl .token.in { background: var(--brass); color: var(--brass-ink); box-shadow: inset 0 0 0 5px var(--brass), inset 0 0 0 7px var(--brass-ink); }
.decl .token.out { background: rgba(0,0,0,.3); color: var(--muted); border: 2px dashed var(--felt-line); }
.decl .who { font-size: 14px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes flip { from { transform: rotateY(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
.verdict { background: rgba(0,0,0,.24); border: 1px solid var(--felt-line); border-radius: 18px; padding: 18px 20px; display: grid; gap: 10px; width: 100%; max-width: 760px; }
.verdict h2 { font-size: clamp(20px, 2.6vw, 26px); color: var(--ivory); }
.transfers { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.xfer { background: var(--rail); border: 1px solid var(--rail-hi); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.xfer b { color: var(--brass-hi); }
.showdown { display: grid; gap: 12px; width: 100%; max-width: 760px; }
.sd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 14px 16px 18px; border-radius: 14px; background: rgba(0,0,0,.18); border: 1px solid var(--felt-line); text-align: left; }
.sd.win { border-color: var(--brass); background: rgba(214,165,75,.12); }
.sd .name { font-weight: 700; font-size: 17px; min-width: 0; overflow-wrap: anywhere; }
.sd .what { color: var(--muted); font-size: 14px; }
.sd .tag { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--rail); color: var(--muted); white-space: nowrap; }
.sd.win .tag { background: var(--brass); color: var(--brass-ink); }
.sd .hand { grid-column: 1 / -1; justify-content: flex-start; }
.banner {
  width: 100%; max-width: 760px; text-align: center; padding: 22px; border-radius: 18px;
  background: linear-gradient(180deg, rgba(242,205,127,.22), rgba(214,165,75,.08)); border: 1px solid var(--brass);
}
.banner .headline { color: var(--brass-hi); }

/* ---------- Seats ---------- */
.seats { display: grid; gap: 10px; min-width: 0; }
.seats-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.seats-head h3 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.seats-head span { font-size: 12px; color: var(--muted); }
.seat {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  padding: 10px 12px; border-radius: 12px; background: var(--rail); border: 1px solid var(--rail-hi);
}
.seat.active { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.seat .dealer { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: transparent; }
.seat .dealer.on { background: var(--ivory); color: var(--ink); border: 0; }
.seat .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .chips { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.seat .legs { display: flex; gap: 4px; align-items: center; }
.seat .legs i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--brass); }
.seat .legs i.got { background: var(--brass-hi); border-color: var(--brass-hi); box-shadow: 0 0 6px rgba(242,205,127,.6); }
.seat .net { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
.seat .rb { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
.seat .nudge { grid-column: 2 / -1; justify-self: start; margin-top: 6px; }
.seat.broke .chips { color: var(--bad); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pick { display: grid; gap: 2px; justify-items: start; text-align: left; padding: 12px 14px; border-radius: 14px; min-width: 0; background: var(--rail); border: 2px solid var(--rail-hi); color: var(--text); }
.pick:hover { border-color: var(--brass); }
.pick .nm { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .st { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pick[aria-pressed="true"] { background: var(--brass); border-color: var(--brass-hi); color: var(--brass-ink); }
.pick[aria-pressed="true"] .st { color: var(--brass-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.pos { color: var(--good); } .neg { color: var(--bad); } .zero { color: var(--muted); }
.status { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
.status.in { color: var(--brass-hi); }
.status.locked { color: var(--good); }
details.log { background: rgba(0,0,0,.2); border: 1px solid var(--felt-line); border-radius: 12px; padding: 10px 12px; }
details.log summary { cursor: pointer; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
details.log ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; max-height: 280px; overflow-y: auto; font-size: 13px; color: var(--muted); }
details.log li { border-top: 1px solid var(--felt-line); padding-top: 6px; }
.house { font-size: 13px; color: var(--muted); padding: 0 4px; display: grid; gap: 2px; }

/* ---------- Setup ---------- */
.setup { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 26px; padding-top: 26px; align-items: start; }
@media (max-width: 860px) { .setup { grid-template-columns: minmax(0, 1fr); } }
.panel { background: rgba(0,0,0,.22); border: 1px solid var(--felt-line); border-radius: 20px; padding: 22px clamp(16px, 3vw, 28px); display: grid; gap: 18px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--ivory); }
.panel h3 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-hi); }
.names { display: grid; gap: 8px; }
.name-row { display: flex; gap: 8px; align-items: center; }
.name-row .seatno { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--rail); font-size: 12px; font-weight: 700; color: var(--muted); }
input[type="text"], input[type="number"], select {
  width: 100%; min-width: 0; background: var(--felt-deep); border: 1px solid var(--felt-line); border-radius: 8px; padding: 9px 11px;
}
input:focus, select:focus { border-color: var(--brass); outline: none; box-shadow: 0 0 0 2px rgba(214,165,75,.35); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.field { display: grid; gap: 5px; align-content: start; min-width: 0; }
.field label { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--brass); flex: none; }
.err { color: var(--bad); font-size: 14px; }
.rules { display: grid; gap: 14px; font-size: 15px; }
.rules ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.rules li::marker { color: var(--brass-hi); font-weight: 700; }
.rules strong { color: var(--ivory); }
.ranks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ranks div { background: rgba(0,0,0,.18); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.ranks b { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-hi); margin-bottom: 4px; }
.ranks ol { padding-left: 18px; gap: 2px; }

/* ---------- Modal ---------- */
.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 10; backdrop-filter: blur(3px); }
.modal .sheet { background: var(--felt-deep); border: 1px solid var(--felt-line); border-radius: 20px; width: min(760px, 100%); max-height: calc(100% - 24px); overflow-y: auto; padding: 24px clamp(16px, 3vw, 30px); display: grid; gap: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--ivory); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--felt-line); white-space: nowrap; }
th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.confirm { background: rgba(255,156,140,.08); border: 1px solid var(--bad); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }

@media (max-width: 520px) {
  .tracker .num { font-size: 34px; }
  .chipbtn { width: 112px; height: 112px; font-size: 28px; }
  .chipbtn small { bottom: 20px; }
  .stage { padding: 28px 20px; border-radius: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div id="app" class="wrap"></div>
<div id="modal-root"></div>

<script>
'use strict';

/* =================== Card + hand evaluation (pure) =================== */
/*EVAL-START*/
const RANK_SHORT = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
const RANK_NAME = { 2: 'Two', 3: 'Three', 4: 'Four', 5: 'Five', 6: 'Six', 7: 'Seven', 8: 'Eight', 9: 'Nine', 10: 'Ten', 11: 'Jack', 12: 'Queen', 13: 'King', 14: 'Ace' };
const RANK_PLURAL = { 2: 'Twos', 3: 'Threes', 4: 'Fours', 5: 'Fives', 6: 'Sixes', 7: 'Sevens', 8: 'Eights', 9: 'Nines', 10: 'Tens', 11: 'Jacks', 12: 'Queens', 13: 'Kings', 14: 'Aces' };
const SUIT = ['♠', '♥', '♦', '♣'];
const SUIT_NAME = ['Spades', 'Hearts', 'Diamonds', 'Clubs'];
const ROUNDS = [
  { cards: 3, wild: 3, label: 'Threes wild' },
  { cards: 5, wild: 5, label: 'Fives wild' },
  { cards: 7, wild: 7, label: 'Sevens wild' },
];
const rs = r => RANK_SHORT[r] || String(r);

// Every multiset of w ranks (2..14) — the values a set of w wild cards could take.
const MS_CACHE = {};
function multisets(w) {
  if (MS_CACHE[w]) return MS_CACHE[w];
  const out = [], cur = [];
  (function rec(k, start) {
    if (k === 0) { out.push(cur.slice()); return; }
    for (let r = start; r <= 14; r++) { cur.push(r); rec(k - 1, r); cur.pop(); }
  })(w, 2);
  return (MS_CACHE[w] = out);
}
function combos(n, k) {
  const out = [], cur = [];
  (function rec(i) {
    if (cur.length === k) { out.push(cur.slice()); return; }
    for (let j = i; j < n; j++) { cur.push(j); rec(j + 1); cur.pop(); }
  })(0);
  return out;
}
function cmpValue(a, b) {
  const n = Math.max(a.length, b.length);
  for (let i = 0; i < n; i++) {
    const x = a[i] ?? -1, y = b[i] ?? -1;
    if (x !== y) return x - y;
  }
  return 0;
}
function groupsOf(ranks) {
  const c = {};
  for (const r of ranks) c[r] = (c[r] || 0) + 1;
  return Object.keys(c).map(r => [+r, c[r]]).sort((a, b) => b[1] - a[1] || b[0] - a[0]);
}
const desc = a => a.slice().sort((x, y) => y - x);

// Five-card value. `suited` = every card can share one suit. Five of a kind tops the chart.
function score5(ranks, suited) {
  const g = groupsOf(ranks), s = desc(ranks), distinct = g.length === 5;
  let sh = 0;
  if (distinct) {
    if (s[0] - s[4] === 4) sh = s[0];
    else if (s[0] === 14 && s[1] === 5 && s[4] === 2) sh = 5; // A-2-3-4-5
  }
  const fl = suited && distinct;
  if (g[0][1] === 5) return [9, g[0][0]];
  if (sh && fl) return [8, sh];
  if (g[0][1] === 4) return [7, g[0][0], g[1][0]];
  if (g[0][1] === 3 && g[1][1] === 2) return [6, g[0][0], g[1][0]];
  if (fl) return [5, ...s];
  if (sh) return [4, sh];
  if (g[0][1] === 3) return [3, g[0][0], g[1][0], g[2][0]];
  if (g[0][1] === 2 && g[1][1] === 2) return [2, g[0][0], g[1][0], g[2][0]];
  if (g[0][1] === 2) return [1, g[0][0], g[1][0], g[2][0], g[3][0]];
  return [0, ...s];
}

// Three-card value. Without runs (the usual 3-5-7 house rule): trips > pair > high card.
// With runs: straight flush > trips > straight > flush > pair > high card (three-card poker order).
function score3(ranks, suited, runs) {
  const g = groupsOf(ranks), s = desc(ranks), distinct = g.length === 3;
  if (!runs) {
    if (g[0][1] === 3) return [2, g[0][0]];
    if (g[0][1] === 2) return [1, g[0][0], g[1][0]];
    return [0, ...s];
  }
  let sh = 0;
  if (distinct) {
    if (s[0] - s[2] === 2) sh = s[0];
    else if (s[0] === 14 && s[1] === 3 && s[2] === 2) sh = 3; // A-2-3
  }
  const fl = suited && distinct;
  if (sh && fl) return [5, sh];
  if (g[0][1] === 3) return [4, g[0][0]];
  if (sh) return [3, sh];
  if (fl) return [2, ...s];
  if (g[0][1] === 2) return [1, g[0][0], g[1][0]];
  return [0, ...s];
}

// Best hand from 3, 5 or 7 cards. Wild cards may stand for any card (duplicates allowed),
// so they are tried as every rank; if the natural cards share a suit, the wilds join it.
function bestHand(cards, wildRank, runs) {
  const three = cards.length === 3;
  const sets = three ? [[0, 1, 2]] : combos(cards.length, 5);
  let best = null;
  for (const idx of sets) {
    const nat = [], wilds = [];
    for (const i of idx) (cards[i].r === wildRank ? wilds : nat).push(i);
    const suited = nat.every(i => cards[i].s === cards[nat[0]].s);
    const natRanks = nat.map(i => cards[i].r);
    for (const m of multisets(wilds.length)) {
      const v = three ? score3(natRanks.concat(m), suited, runs) : score5(natRanks.concat(m), suited);
      if (!best || cmpValue(v, best.value) > 0) best = { value: v, used: idx, wilds, subs: m };
    }
  }
  best.mode = three ? (runs ? 'threeRuns' : 'three') : 'five';
  best.label = describe(best.value, best.mode);
  best.as = {};
  // Show each wild as the rank it plays as. Sort high first so the display reads naturally.
  const subs = desc(best.subs);
  best.wilds.forEach((ci, k) => { best.as[ci] = subs[k]; });
  return best;
}

function describe(v, mode) {
  const P = r => RANK_PLURAL[r], N = r => RANK_NAME[r];
  if (mode === 'five') {
    switch (v[0]) {
      case 9: return `Five ${P(v[1])}`;
      case 8: return v[1] === 14 ? 'Royal flush' : `Straight flush, ${N(v[1])} high`;
      case 7: return `Four ${P(v[1])}`;
      case 6: return `Full house, ${P(v[1])} over ${P(v[2])}`;
      case 5: return `Flush, ${N(v[1])} high`;
      case 4: return `Straight, ${N(v[1])} high`;
      case 3: return `Three ${P(v[1])}`;
      case 2: return `Two pair, ${P(v[1])} and ${P(v[2])}`;
      case 1: return `Pair of ${P(v[1])}`;
      default: return `${N(v[1])} high`;
    }
  }
  const cat = mode === 'threeRuns'
    ? ['high', 'pair', 'flush', 'straight', 'trips', 'sf'][v[0]]
    : ['high', 'pair', 'trips'][v[0]];
  switch (cat) {
    case 'sf': return `Straight flush, ${N(v[1])} high`;
    case 'trips': return `Three ${P(v[1])}`;
    case 'straight': return `Straight, ${N(v[1])} high`;
    case 'flush': return `Flush, ${N(v[1])} high`;
    case 'pair': return `Pair of ${P(v[1])}`;
    default: return `${N(v[1])} high`;
  }
}

/* =================== Game state =================== */
const STORE_KEY = 'poker357.v1';
const DEFAULTS = {
  startChips: 100, ante: 1, legsToWin: 3,
  payAmount: 'pot', fixedAmount: 5, whoPays: 'all', payTo: 'winner',
  threeCardRuns: false, nobodyIn: 'redeal', chipValue: 0.25,
};
let state = null;
let ui = { modal: null, confirmReset: false, setupNames: ['Player 1', 'Player 2', 'Player 3', 'Player 4'], setupError: '' };

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }
function load() { try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); return s && s.v === 1 ? s : null; } catch (e) { return null; } }
function clearSaved() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } }

function randInt(n) {
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n;
    do { crypto.getRandomValues(a); } while (a[0] >= lim);
    return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}
function freshDeck() {
  const d = [];
  for (let s = 0; s < 4; s++) for (let r = 2; r <= 14; r++) d.push({ r, s });
  for (let i = d.length - 1; i > 0; i--) { const j = randInt(i + 1); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
const N = () => state.players.length;
// Total chips a player has bought, buy-in plus rebuys. Older saves only had the buy-in.
const boughtOf = p => p.bought ?? state.settings.startChips;
const nameOf = i => state.players[i].name;
// Seat order for the current deal: starting left of the dealer.
function seatOrder() { const n = N(); return Array.from({ length: n }, (_, k) => (state.dealer + 1 + k) % n); }
function log(msg) { state.log.unshift({ t: Date.now(), msg }); if (state.log.length > 200) state.log.length = 200; }
function plural(n, w) { return `${n} ${w}${n === 1 ? '' : 's'}`; }

function startNight(names, settings) {
  state = {
    v: 1, settings, phase: 'declare',
    players: names.map(name => ({ name, chips: settings.startChips, legs: 0, hand: [], decl: null, fresh: 0, bought: settings.startChips, rebuys: 0 })),
    dealer: names.length - 1, round: 0, pot: 0, deck: [], declare: null, result: null,
    gameNo: 1, handNo: 0, gameOver: false, log: [],
  };
  log(`Night started with ${names.length} players, ${settings.startChips} chips each. First to ${plural(settings.legsToWin, 'leg')} takes the pot.`);
  newHand();
}

function newHand() {
  const S = state.settings;
  state.dealer = (state.dealer + 1) % N();
  state.deck = freshDeck();
  state.handNo++;
  for (const p of state.players) { p.hand = state.deck.splice(0, 3); p.fresh = 0; p.chips -= S.ante; }
  state.pot += S.ante * N();
  state.round = 0; state.result = null;
  log(`Hand ${state.handNo}: ${nameOf(state.dealer)} deals. Everyone antes ${S.ante}; pot is ${state.pot}.`);
  beginDeclare();
}

function dealMore() {
  for (const p of state.players) { p.hand.push(...state.deck.splice(0, 2)); p.fresh = 2; }
  state.round++;
  state.result = null;
  log(`Two more cards each. ${ROUNDS[state.round].label}.`);
  beginDeclare();
}

function beginDeclare() {
  for (const p of state.players) p.decl = null;
  state.phase = 'declare';
  state.declare = { pos: 0, peeking: false, canUndo: false };
}

function currentDeclarer() { const o = seatOrder(); return state.declare.pos < o.length ? o[state.declare.pos] : null; }

function choose(isIn) {
  const i = currentDeclarer();
  state.players[i].decl = isIn;
  state.declare.pos++;
  state.declare.peeking = false;
  state.declare.canUndo = true;
}
function undoChoice() {
  state.declare.pos--;
  state.players[currentDeclarer()].decl = null;
  state.declare.peeking = true;
  state.declare.canUndo = state.declare.pos > 0;
}

function applyRebuy(i, amt) {
  const p = state.players[i];
  p.bought = boughtOf(p) + amt;
  p.chips += amt;
  p.rebuys = (p.rebuys || 0) + 1;
  log(`${p.name} rebought for ${amt} chips (${money(amt * state.settings.chipValue)}).`);
}

function payBase() { const S = state.settings; return S.payAmount === 'pot' ? state.pot : S.fixedAmount; }

function resolveRound() {
  const S = state.settings, P = state.players, rnd = ROUNDS[state.round];
  const order = seatOrder();
  const ins = order.filter(i => P[i].decl === true);
  const res = { round: state.round, ins, type: '', evals: {}, winners: [], payers: [], transfers: [], legs: [], potWinners: [], potWon: 0 };

  if (ins.length === 0) {
    res.type = 'none';
    log(`${rnd.label} round: nobody stayed in.`);
  } else if (ins.length === 1) {
    res.type = 'solo';
    P[ins[0]].legs++;
    res.legs = [ins[0]];
    log(`${nameOf(ins[0])} went in alone and took a leg (${P[ins[0]].legs}/${S.legsToWin}).`);
  } else {
    for (const i of ins) res.evals[i] = bestHand(P[i].hand, rnd.wild, S.threeCardRuns);
    const val = i => res.evals[i].value;
    const top = ins.reduce((b, i) => (cmpValue(val(i), val(b)) > 0 ? i : b));
    res.winners = ins.filter(i => cmpValue(val(i), val(top)) === 0);
    const losers = ins.filter(i => !res.winners.includes(i));
    if (losers.length === 0) {
      res.type = 'tie';
      for (const i of res.winners) P[i].legs++;
      res.legs = res.winners.slice();
      log(`Dead heat: ${res.winners.map(nameOf).join(', ')} tie with ${res.evals[top].label}; each takes a leg.`);
    } else {
      res.type = 'showdown';
      const base = payBase();
      res.base = base;
      if (S.whoPays === 'worst') {
        const bottom = losers.reduce((b, i) => (cmpValue(val(i), val(b)) < 0 ? i : b));
        res.payers = losers.filter(i => cmpValue(val(i), val(bottom)) === 0);
      } else {
        res.payers = losers.slice();
      }
      const W = res.winners.length;
      for (const payer of res.payers) {
        P[payer].chips -= base;
        if (S.payTo === 'pot') {
          state.pot += base;
          res.transfers.push({ from: payer, to: 'pot', amt: base });
        } else {
          const share = Math.floor(base / W), rem = base % W;
          res.winners.forEach((w, k) => {
            const amt = share + (k < rem ? 1 : 0);
            P[w].chips += amt;
            res.transfers.push({ from: payer, to: w, amt });
          });
        }
      }
      const pays = res.transfers.map(t => `${nameOf(t.from)} → ${t.to === 'pot' ? 'pot' : nameOf(t.to)} ${t.amt}`).join(', ');
      log(`${res.winners.map(nameOf).join(' & ')} won the showdown with ${res.evals[top].label}. ${pays}.`);
    }
  }

  const reached = order.filter(i => P[i].legs >= S.legsToWin);
  if (reached.length) {
    const pot = state.pot, share = Math.floor(pot / reached.length), rem = pot % reached.length;
    reached.forEach((i, k) => { P[i].chips += share + (k < rem ? 1 : 0); });
    res.potWinners = reached; res.potWon = pot;
    state.pot = 0;
    state.gameOver = true;
    log(`Game ${state.gameNo}: ${reached.map(nameOf).join(' & ')} reached ${plural(S.legsToWin, 'leg')} and won the pot of ${pot}.`);
  }
  state.result = res;
  state.phase = 'reveal';
}

function proceed() {
  const S = state.settings, res = state.result;
  if (state.gameOver) {
    state.gameOver = false;
    state.gameNo++;
    for (const p of state.players) p.legs = 0;
    log(`Game ${state.gameNo} begins. Legs reset.`);
    newHand();
  } else if (res.type === 'none' && S.nobodyIn === 'redeal') {
    log('Cards thrown in for a fresh deal.');
    newHand();
  } else if (state.round < 2) {
    dealMore();
  } else {
    newHand();
  }
}

function proceedLabel() {
  const S = state.settings, res = state.result;
  if (state.gameOver) return `Start game ${state.gameNo + 1} (everyone antes ${S.ante})`;
  if (res.type === 'none' && S.nobodyIn === 'redeal') return `Throw in and re-deal (everyone antes ${S.ante})`;
  if (state.round < 2) return `Deal 2 more cards: ${ROUNDS[state.round + 1].label.toLowerCase()}`;
  return `New hand (everyone antes ${S.ante})`;
}

    <div class="besthand"><span class="k">Your best hand</span><span class="v">${best.label}</span></div>
    <div class="stakes">
      <div class="stake"><div class="k">Go in alone</div><div class="v">Take a leg (you have ${p.legs} of ${S.legsToWin})</div></div>
      <div class="stake"><div class="k">Lose a showdown</div><div class="v">${stakeText()}</div></div>
    </div>
    <div class="choice">
      <button class="chipbtn in" data-act="in" aria-label="I'm in">IN<small>stay</small></button>
      <button class="chipbtn out" data-act="out" aria-label="I'm out">OUT<small>drop</small></button>
    </div>
    <button class="link" data-act="hide">Hide my cards without choosing</button>
  </section>`;
}

function stageReveal() {
  const S = state.settings, res = state.result, rnd = ROUNDS[res.round], P = state.players;
  const order = seatOrder();
  const decls = order.map((i, k) => `<div class="decl"><div class="token ${P[i].decl ? 'in' : 'out'}" style="--i:${k}">${P[i].decl ? 'IN' : 'OUT'}</div><div class="who">${esc(P[i].name)}</div></div>`).join('');
  let verdict = '', showdown = '';

  if (res.type === 'none') {
    verdict = `<h2>Nobody stayed in.</h2><p class="sub">${S.nobodyIn === 'redeal' ? 'The cards are thrown in and everyone antes again for a fresh deal. The pot carries over.' : (res.round < 2 ? 'Play moves on to the next round.' : 'That was the last round, so a new hand is dealt.')}</p>`;
  } else if (res.type === 'solo') {
    const w = res.legs[0];
    verdict = `<h2>${esc(nameOf(w))} went in alone and takes a leg.</h2><p class="sub">${esc(nameOf(w))} now has ${P[w].legs} of ${S.legsToWin}. Their cards stay hidden.</p>`;
  } else {
    const top = res.evals[res.winners[0]];
    if (res.type === 'tie') {
      verdict = `<h2>Dead heat: ${res.winners.map(i => esc(nameOf(i))).join(' and ')} tie with ${top.label}.</h2><p class="sub">Everyone who stayed in tied, so each of them takes a leg and no chips change hands.</p>`;
    } else {
      const xf = res.transfers.map(t => `<span class="xfer">${esc(nameOf(t.from))} pays ${t.to === 'pot' ? 'the pot' : esc(nameOf(t.to))} <b>${t.amt}</b></span>`).join('');
      verdict = `<h2>${res.winners.map(i => esc(nameOf(i))).join(' and ')} ${res.winners.length > 1 ? 'split it' : 'wins'} with ${top.label}.</h2>
        <div class="transfers">${xf}</div>
        <p class="sub">Showdowns don't win legs or the pot${S.payTo === 'pot' ? '; the losers feed the pot instead' : ''}. The pot is now ${state.pot}.</p>`;
    }
    const sorted = res.ins.slice().sort((a, b) => cmpValue(res.evals[b].value, res.evals[a].value));
    showdown = `<div class="showdown">${sorted.map(i => {
      const e = res.evals[i], win = res.winners.includes(i);
      const paid = res.transfers.filter(t => t.from === i).reduce((s, t) => s + t.amt, 0);
      const got = res.transfers.filter(t => t.to === i).reduce((s, t) => s + t.amt, 0);
      const tag = res.type === 'tie' ? 'Leg' : win ? `Wins ${got}` : paid ? `Pays ${paid}` : 'Loses, no pay';
      return `<div class="sd ${win ? 'win' : ''}"><div><div class="name">${esc(nameOf(i))}</div><div class="what">${e.label}</div></div><span class="tag">${tag}</span>${handHTML(P[i].hand, rnd.wild, e, 'sm')}</div>`;
    }).join('')}</div>`;
  }

  const banner = res.potWinners.length ? `<div class="banner"><div class="eyebrow">Game ${state.gameNo} over</div><div class="headline">${res.potWinners.map(i => esc(nameOf(i))).join(' & ')} ${res.potWinners.length > 1 ? 'split' : 'takes'} the pot of ${res.potWon}</div><p class="sub" style="margin:6px auto 0">${plural(S.legsToWin, 'leg')} reached. Legs reset for the next game.</p></div>` : '';

  return `<section class="stage center">
    <div class="eyebrow">${rnd.cards} cards · ${rnd.label} · reveal</div>
    <div class="decls">${decls}</div>
    ${banner}
    <div class="verdict">${verdict}</div>
    ${showdown}
    <div class="row"><button class="btn big" data-act="proceed">${proceedLabel()}</button></div>
  </section>`;
}

function setupHTML() {
  const S = ui.setupSettings || DEFAULTS;
  const names = ui.setupNames;
  const sel = (id, opts, v) => `<select id="${id}">${opts.map(([val, lab]) => `<option value="${val}" ${String(v) === String(val) ? 'selected' : ''}>${lab}</option>`).join('')}</select>`;
  return `${barHTML()}
  <div class="setup">
    <form class="panel" id="setup-form" novalidate>
      <h2>Seat the table</h2>
      <div class="names">
        ${names.map((n, k) => `<div class="name-row"><span class="seatno">${k + 1}</span><input type="text" id="name-${k}" value="${esc(n)}" maxlength="18" aria-label="Player ${k + 1} name">${names.length > 2 ? `<button type="button" class="btn ghost small" data-act="rm-player" data-k="${k}" aria-label="Remove player ${k + 1}">Remove</button>` : ''}</div>`).join('')}
        ${names.length < 7 ? `<div><button type="button" class="btn ghost small" data-act="add-player">+ Add player</button></div>` : ''}
        <p class="hint" style="font-size:12.5px;color:var(--muted)">2 to 7 players. Seven 7-card hands use 49 of the 52 cards. Seat order is the order around your table; the deal passes down this list.</p>
      </div>
      <h3>Chips</h3>
      <div class="fields">
        <div class="field"><label for="startChips">Buy-in (chips)</label><input type="number" id="startChips" min="1" step="1" value="${S.startChips}"><span class="hint" id="buyin-hint">${buyinHint(S.startChips, S.chipValue)}</span></div>
        <div class="field"><label for="ante">Ante per hand</label><input type="number" id="ante" min="0" step="1" value="${S.ante}"><span class="hint">Everyone pays this into the pot before each 3-card deal.</span></div>
        <div class="field"><label for="chipValue">Each chip is worth ($)</label><input type="number" id="chipValue" min="0" step="0.05" value="${S.chipValue}"><span class="hint">Only used for the settle-up math. Set 0 to play for fun.</span></div>
      </div>
      <h3>House rules</h3>
      <div class="fields">
        <div class="field"><label for="legsToWin">Legs to win the pot</label>${sel('legsToWin', [[2, '2 legs'], [3, '3 legs (most common)'], [4, '4 legs'], [5, '5 legs']], S.legsToWin)}</div>
        <div class="field"><label for="payAmount">A losing hand pays</label>${sel('payAmount', [['pot', 'The size of the pot'], ['fixed', 'A fixed amount']], S.payAmount)}</div>
        <div class="field" ${S.payAmount === 'fixed' ? '' : 'hidden'} id="fixed-wrap"><label for="fixedAmount">Fixed amount (chips)</label><input type="number" id="fixedAmount" min="0" step="1" value="${S.fixedAmount}"></div>
        <div class="field"><label for="whoPays">Who pays in a showdown</label>${sel('whoPays', [['all', 'Every losing hand'], ['worst', 'Only the worst hand']], S.whoPays)}</div>
        <div class="field"><label for="payTo">Losers pay</label>${sel('payTo', [['winner', 'The winning player'], ['pot', 'Into the pot (pot grows)']], S.payTo)}</div>
        <div class="field"><label for="nobodyIn">If nobody stays in</label>${sel('nobodyIn', [['redeal', 'Throw in, re-ante, re-deal'], ['continue', 'Just deal the next round']], S.nobodyIn)}</div>
      </div>
      <label class="check"><input type="checkbox" id="threeCardRuns" ${S.threeCardRuns ? 'checked' : ''}><span><b>Count straights and flushes in the 3-card round</b><br><span class="hint" style="font-size:12.5px;color:var(--muted)">Off is the usual home rule: three of a kind, then pair, then high card. On uses three-card poker order, where a straight beats a flush.</span></span></label>
      ${ui.setupError ? `<p class="err" role="alert">${esc(ui.setupError)}</p>` : ''}
      <div class="row"><button class="btn big" type="submit">Shuffle up and deal</button></div>
    </form>
    <section class="panel rules" aria-label="How 3-5-7 works">${rulesBody()}</section>
  </div>`;
}

function buyinHint(chips, value) {
  return value > 0 ? `Each player buys in for ${money(chips * value)}. Rebuys default to this.` : 'Rebuys default to this amount.';
}

function rulesBody() {
  return `<h2>How 3-5-7 works</h2>
    <ol>
      <li><strong>Ante and deal 3.</strong> Everyone antes into the pot and gets three cards. <strong>Threes are wild.</strong></li>
      <li><strong>Declare in or out, all at once.</strong> At a real table you hold a chip in a closed fist. Here, each player takes a private turn at the computer, then everyone's choice flips at the same moment.</li>
      <li><strong>Go in alone and you win a leg.</strong> If you're the only one in, you take a leg and nobody sees your cards.</li>
      <li><strong>Two or more in means a showdown.</strong> Best hand wins. Losers pay the winner the size of the pot (the house rules can change this). The pot itself stays put.</li>
      <li><strong>Deal 2 more: 5 cards, fives wild.</strong> Threes are no longer wild. Declare again. Everyone gets the new cards, including players who dropped last round.</li>
      <li><strong>Deal 2 more: 7 cards, sevens wild.</strong> Make your best five-card hand from seven. Declare again.</li>
      <li><strong>Repeat until someone has enough legs.</strong> After the 7-card round, cards are collected, everyone antes again and the deal passes left. Legs carry over. The first player to reach the target (usually 3) takes the whole pot.</li>
    </ol>
    <div class="ranks">
      <div><b>3-card round</b><ol><li>Three of a kind</li><li>Pair</li><li>High card</li></ol></div>
      <div><b>5 and 7-card rounds</b><ol><li>Five of a kind</li><li>Straight flush</li><li>Four of a kind</li><li>Full house</li><li>Flush</li><li>Straight</li><li>Three of a kind</li><li>Two pair</li><li>Pair</li><li>High card</li></ol></div>
    </div>
    <p class="sub">A wild card can be any card, even one you already hold. Aces play high or low in straights. If everyone who stayed in ties, each of them takes a leg.</p>
    <p class="sub">Busted? <strong>Rebuy</strong> in the top bar adds chips, and Settle up counts the extra money you put in.</p>`;
}

function rulesModal() {
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Rules"><div class="sheet rules">
    <div class="sheet-head"><span class="eyebrow">Rules</span><button class="btn ghost small" data-act="close">Close</button></div>
    ${rulesBody()}
    ${state ? `<div><h3 style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass-hi);margin-bottom:6px">Tonight's house rules</h3>${houseRulesShort().map(t => `<p class="sub">${t}</p>`).join('')}<p class="sub">${state.settings.nobodyIn === 'redeal' ? 'If nobody stays in, the cards are thrown in and everyone re-antes for a fresh deal.' : 'If nobody stays in, play moves on to the next round.'}</p></div>` : ''}
  </div></div>`;
}

function settleModal() {
  const S = state.settings, P = state.players;
  const n = P.length, potShare = Math.floor(state.pot / n), potRem = state.pot % n;
  const rows = P.map((p, i) => {
    const back = potShare + (i < potRem ? 1 : 0);
    const net = p.chips + back - boughtOf(p);
    return { name: p.name, bought: boughtOf(p), chips: p.chips, back, net };
  });
  // Greedy settle: biggest debtor pays biggest creditor until everyone is square.
  const cents = rows.map(r => Math.round(r.net * S.chipValue * 100));
  const debt = cents.map((c, i) => ({ i, c })).filter(x => x.c < 0).map(x => ({ i: x.i, c: -x.c })).sort((a, b) => b.c - a.c);
  const cred = cents.map((c, i) => ({ i, c })).filter(x => x.c > 0).sort((a, b) => b.c - a.c);
  const pays = [];
  let a = 0, b = 0;
  while (a < debt.length && b < cred.length) {
    const m = Math.min(debt[a].c, cred[b].c);
    if (m > 0) pays.push({ from: debt[a].i, to: cred[b].i, c: m });
    debt[a].c -= m; cred[b].c -= m;
    if (debt[a].c === 0) a++;
    if (cred[b].c === 0) b++;
  }
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Settle up"><div class="sheet">
    <div class="sheet-head"><h2>Settle up</h2><button class="btn ghost small" data-act="close">Back to the game</button></div>
    <p class="sub">If you stopped right now. ${state.pot ? `The ${state.pot}-chip pot hasn't been won yet, so it's split evenly back to everyone.` : 'The pot is empty.'}</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Player</th><th class="num">${S.chipValue > 0 ? 'Paid in' : 'Bought in'}</th><th class="num">Chips</th><th class="num">Pot share</th><th class="num">Net chips</th><th class="num">Net $</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${S.chipValue > 0 ? money(r.bought * S.chipValue) : r.bought}</td><td class="num">${r.chips}</td><td class="num">${r.back}</td><td class="num ${r.net > 0 ? 'pos' : r.net < 0 ? 'neg' : 'zero'}">${signed(r.net)}</td><td class="num ${r.net > 0 ? 'pos' : r.net < 0 ? 'neg' : 'zero'}">${money(r.net * S.chipValue)}</td></tr>`).join('')}</tbody>
    </table></div>
    ${S.chipValue > 0 ? `<div class="transfers">${pays.length ? pays.map(p => `<span class="xfer">${esc(P[p.from].name)} pays ${esc(P[p.to].name)} <b>${money(p.c / 100)}</b></span>`).join('') : '<span class="sub">Everyone is square.</span>'}</div>` : ''}
    ${ui.confirmReset
      ? `<div class="confirm"><p>End the night? This clears every chip count and starts over at the seating screen.</p><div class="row"><button class="btn small" data-act="reset-yes">Yes, end the night</button><button class="btn ghost small" data-act="reset-no">Keep playing</button></div></div>`
      : `<div class="row"><button class="btn ghost small" data-act="reset-ask">End the night and start over</button></div>`}
  </div></div>`;
}

function rebuyCost(amt) {
  const v = state.settings.chipValue;
  return v > 0 ? `That's ${money(amt * v)} at ${money(v)} a chip.` : 'Playing for fun, so no money changes hands.';
}
function rebuyLabel(who, amt) {
  if (who === null) return 'Pick a player';
  if (!(amt > 0)) return 'Enter how many chips';
  return `Add ${amt} chips to ${nameOf(who)}`;
}
function readRebuyAmt() {
  const el = document.getElementById('rebuy-amt');
  const x = el ? Math.round(parseFloat(el.value)) : ui.rebuyAmt;
  return Number.isFinite(x) ? Math.max(0, x) : 0;
}
function rebuyModal() {
  const who = ui.rebuyFor, amt = ui.rebuyAmt, ok = who !== null && amt > 0;
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Rebuy"><div class="sheet">
    <div class="sheet-head"><h2>Rebuy</h2><button class="btn ghost small" data-act="close">Cancel</button></div>
    <p class="sub">Who's buying more chips?</p>
    <div class="picks">${state.players.map((p, i) => `<button class="pick" data-act="rb-pick" data-i="${i}" aria-pressed="${who === i}"><span class="nm">${esc(p.name)}</span><span class="st">${p.chips} chips${p.rebuys ? ' · ' + plural(p.rebuys, 'rebuy') : ''}</span></button>`).join('')}</div>
    <div class="field" style="max-width:280px"><label for="rebuy-amt">Chips to add</label><input type="number" id="rebuy-amt" min="1" step="1" value="${amt}"><span class="hint" id="rebuy-cost">${rebuyCost(amt)}</span></div>
    <div class="row"><button class="btn" data-act="rb-confirm" id="rb-confirm" ${ok ? '' : 'disabled'}>${esc(rebuyLabel(who, amt))}</button></div>
  </div></div>`;
}

function render() {
  if (!state) {
    app.innerHTML = setupHTML();
  } else {
    const stage = state.phase === 'declare' ? stageDeclare() : stageReveal();
    app.innerHTML = `${barHTML()}<div class="main">${stage}${seatsHTML()}</div>`;
  }
  modalRoot.innerHTML = ui.modal === 'rules' ? rulesModal()
    : ui.modal === 'settle' && state ? settleModal()
    : ui.modal === 'rebuy' && state ? rebuyModal() : '';
}

/* =================== Setup form =================== */
function readSetup() {
  const v = id => document.getElementById(id);
  const names = ui.setupNames.map((_, k) => (v('name-' + k)?.value ?? '').trim());
  const num = (id, d) => { const x = parseFloat(v(id)?.value); return Number.isFinite(x) ? x : d; };
  const settings = {
    startChips: Math.max(1, Math.round(num('startChips', DEFAULTS.startChips))),
    ante: Math.max(0, Math.round(num('ante', DEFAULTS.ante))),
    chipValue: Math.max(0, Math.round(num('chipValue', DEFAULTS.chipValue) * 100) / 100),
    legsToWin: parseInt(v('legsToWin').value, 10),
    payAmount: v('payAmount').value,
    fixedAmount: Math.max(0, Math.round(num('fixedAmount', DEFAULTS.fixedAmount))),
    whoPays: v('whoPays').value,
    payTo: v('payTo').value,
    nobodyIn: v('nobodyIn').value,
    threeCardRuns: v('threeCardRuns').checked,
  };
  return { names, settings };
}
function stashSetup() { if (!state && document.getElementById('setup-form')) { const { names, settings } = readSetup(); ui.setupNames = names; ui.setupSettings = settings; } }

document.addEventListener('submit', e => {
  if (e.target.id !== 'setup-form') return;
  e.preventDefault();
  const { names, settings } = readSetup();
  const filled = names.map((n, k) => n || `Player ${k + 1}`);
  const lower = filled.map(n => n.toLowerCase());
  if (new Set(lower).size !== lower.length) { ui.setupNames = names; ui.setupSettings = settings; ui.setupError = 'Two players have the same name. Give everyone a different name so the hand-offs are clear.'; render(); return; }
  ui.setupError = '';
  startNight(filled, settings);
  save(); render(); window.scrollTo(0, 0);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'startChips' || id === 'chipValue') {
    const h = document.getElementById('buyin-hint');
    const c = parseFloat(document.getElementById('startChips').value) || 0, v = parseFloat(document.getElementById('chipValue').value) || 0;
    if (h) h.textContent = buyinHint(Math.round(c), Math.round(v * 100) / 100);
  } else if (id === 'rebuy-amt') {
    ui.rebuyAmt = readRebuyAmt();
    document.getElementById('rebuy-cost').textContent = rebuyCost(ui.rebuyAmt);
    const b = document.getElementById('rb-confirm');
    b.disabled = !(ui.rebuyFor !== null && ui.rebuyAmt > 0);
    b.textContent = rebuyLabel(ui.rebuyFor, ui.rebuyAmt);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'payAmount') { const w = document.getElementById('fixed-wrap'); if (w) w.hidden = e.target.value !== 'fixed'; }
});

/* =================== Actions =================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (e.target.classList && e.target.classList.contains('modal')) { ui.modal = null; ui.confirmReset = false; render(); }
    return;
  }
  if (el.disabled) return;
  const act = el.dataset.act, i = el.dataset.i !== undefined ? +el.dataset.i : null;
  let changed = true, top = false;
  switch (act) {
    case 'add-player': stashSetup(); if (ui.setupNames.length < 7) ui.setupNames.push(`Player ${ui.setupNames.length + 1}`); changed = false; break;
    case 'rm-player': stashSetup(); ui.setupNames.splice(+el.dataset.k, 1); changed = false; break;
    case 'rules': stashSetup(); ui.modal = 'rules'; changed = false; break;
    case 'settle': ui.modal = 'settle'; ui.confirmReset = false; changed = false; break;
    case 'rebuy': ui.modal = 'rebuy'; ui.rebuyFor = i; ui.rebuyAmt = state.settings.startChips; changed = false; break;
    case 'rb-pick': ui.rebuyAmt = readRebuyAmt(); ui.rebuyFor = i; changed = false; break;
    case 'rb-confirm': {
      const amt = readRebuyAmt();
      if (ui.rebuyFor === null || !(amt > 0)) { changed = false; break; }
      applyRebuy(ui.rebuyFor, amt); ui.modal = null; break;
    }
    case 'close': ui.modal = null; ui.confirmReset = false; changed = false; break;
    case 'reset-ask': ui.confirmReset = true; changed = false; break;
    case 'reset-no': ui.confirmReset = false; changed = false; break;
    case 'reset-yes':
      ui.setupNames = state.players.map(p => p.name); ui.setupSettings = state.settings;
      state = null; ui.modal = null; ui.confirmReset = false; clearSaved(); changed = false; top = true; break;
    case 'peek': state.declare.peeking = true; top = true; break;
    case 'hide': state.declare.peeking = false; break;
    case 'in': choose(true); top = true; break;
    case 'out': choose(false); top = true; break;
    case 'undo': undoChoice(); top = true; break;
    case 'reveal': resolveRound(); top = true; break;
    case 'proceed': proceed(); top = true; break;
    default: return;
  }
  if (changed) save();
  render();
  if (top) window.scrollTo(0, 0);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.modal) { ui.modal = null; ui.confirmReset = false; render(); } });

/* =================== Boot =================== */
function boot(data) {
  const snap = data && data.state;
  state = snap && snap.v === 1 ? snap : load();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
